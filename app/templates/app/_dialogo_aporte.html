{#
  Diálogo "Aportar" / "Retirar" de una meta. Lo maneja static/js/metas.js (POST
  /api/v1/metas/{id}/aportes). La plata no sale de ninguna cuenta: es plata apartada para la meta.
#}
<dialog class="dialog" id="dialogo-aporte" aria-labelledby="aporte-titulo" data-dialogo-aporte>
  <form class="dialog__body" data-form-aporte novalidate>
    <header class="dialog__head">
      <h2 class="card-title" id="aporte-titulo" data-titulo>Aportar</h2>
      <button class="dialog__close" type="button" aria-label="Cerrar" data-cerrar>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </header>

    <div class="alert alert--danger" role="alert" data-form-alert hidden></div>

    <fieldset class="segmented dialog__tipo">
      <legend class="visually-hidden">Tipo</legend>
      <label class="segmented__option">
        <input type="radio" name="tipo" value="aporte" checked>
        <span>Aportar</span>
      </label>
      <label class="segmented__option">
        <input type="radio" name="tipo" value="retiro">
        <span>Retirar</span>
      </label>
    </fieldset>

    <p class="sub" data-aporte-nota></p>

    <div class="field">
      <div class="float-field">
        <svg class="float-field__icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 6.5c-.6-1-1.7-1.5-3-1.5-1.8 0-3 .9-3 2.3 0 3.2 6 1.8 6 5.1 0 1.4-1.3 2.4-3 2.4-1.4 0-2.6-.6-3.2-1.6M10 3v14"/></svg>
        <input class="float-field__input dialog__monto num" id="aporte-monto" name="monto" type="text"
               inputmode="numeric" autocomplete="off" placeholder=" " aria-describedby="aporte-monto-error" required data-dinero>
        <label class="float-field__label" for="aporte-monto">Monto</label>
      </div>
      <p class="field__message field__message--error" id="aporte-monto-error" hidden></p>
    </div>

    <div class="field">
      <div class="float-field">
        <svg class="float-field__icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="3"/><path d="M3 8.5h14M7 3v3M13 3v3"/></svg>
        <input class="float-field__input" id="aporte-fecha" name="fecha" type="date" max="{{ hoy_iso }}"
               value="{{ hoy_iso }}" placeholder=" " aria-describedby="aporte-fecha-error" required>
        <label class="float-field__label" for="aporte-fecha">Fecha</label>
      </div>
      <p class="field__message field__message--error" id="aporte-fecha-error" hidden></p>
    </div>

    <div class="dialog__actions">
      <button class="btn btn--primary btn--lg btn--block" type="submit" data-guardar>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="btn__check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>
        <span data-label>Aportar</span>
      </button>
    </div>
  </form>
</dialog>
